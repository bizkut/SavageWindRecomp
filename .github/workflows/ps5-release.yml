name: PS5 release

on:
  push:
    tags: ['ps5-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: savagewind-ps5-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'bizkut/SavageWindRecomp'
    runs-on: [self-hosted, Linux, X64, savagewind-ps5]
    timeout-minutes: 720
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF_NAME" =~ ^ps5-v[0-9][A-Za-z0-9._+-]*$ ]] || {
            echo 'Invalid PS5 release tag.' >&2; exit 1;
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse private game inputs and generated game code
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path.cwd()
          for directory, dirs, files in os.walk(root, followlinks=False):
              rel = Path(directory).relative_to(root)
              if not rel.parts:
                  dirs[:] = [d for d in dirs if d != '.git']
              for name in dirs:
                  path = rel / name
                  if len(path.parts) == 1 and (name in {'input', 'extracted', 'generated', 'keys', 'dump'}
                                               or name.startswith(('extracted-', 'generated-'))):
                      raise SystemExit(f'Private game directory in workspace: {path}')
              for name in files:
                  path = rel / name
                  low = name.lower()
                  if (low.endswith(('.nsp', '.xci', '.nca', '.nsz', '.xcz', '.keys'))
                      or low in {'main.npdm', 'libgamecode.a'}
                      or re.fullmatch(r'(main|sdk|subsdk\d+)_\d+\.c', low)):
                      raise SystemExit(f'Private game file in workspace: {path}')
                  if not (root / path).is_symlink():
                      with (root / path).open('rb') as f:
                          if f.read(4) == b'NSO0':
                              raise SystemExit(f'Private NSO in workspace: {path}')
          PY
      - name: Prepare pinned dependencies
        run: |
          set -euo pipefail
          parent=$(dirname "$GITHUB_WORKSPACE")
          checkout() {
            local path=$1 url=$2 revision=$3
            if [[ ! -d "$path/.git" ]]; then
              git init "$path"
              git -C "$path" remote add origin "$url"
            fi
            git -C "$path" fetch --depth 1 origin "$revision"
            git -C "$path" checkout --detach --force "$revision"
          }
          mkdir -p "$parent/forever"
          checkout "$parent/forever/PS5_PayloadSDK" https://github.com/bizkut/ps5-forever-sdk.git \
            "$(awk '$1 == "payload-sdk" { print $3 }' ps5/deps.lock)"
          checkout "$parent/PS5_MihawkGen" https://github.com/mihawk-99/PS5_MihawkGen.git \
            "$(awk '$1 == "mihawkgen" { print $NF }' ps5/deps.lock)"
          checkout "$parent/nstool2" https://github.com/Clearmist/nstool.git \
            "$(awk '$1 == "nstool2" { print $3 }' ps5/deps.lock)"
          git -C "$parent/nstool2" submodule update --init --recursive
          zlib="$parent/forever/PS5_Vulkan/.deps/native/zlib"
          mkdir -p "$zlib"
          read -r zlib_url zlib_sha < <(awk '$1 == "zlib-source" { sub(/^sha256:/, "", $3); print $2, $3 }' ps5/deps.lock)
          curl -fL --retry 3 "$zlib_url" -o "$zlib/zlib.tar.gz"
          echo "$zlib_sha  $zlib/zlib.tar.gz" | sha256sum --check --strict
          tar -xzf "$zlib/zlib.tar.gz" -C "$zlib"
          bash ps5/tools/setup-deps.sh
          sandbox="$GITHUB_WORKSPACE/.deps/ps5/radv-source/forever"
          checkout "$sandbox/ps5-proton/ps5-wow" https://github.com/bizkut/ps5-forever.git \
            "$(awk '$1 == "radv-recipe" { print $3 }' ps5/deps.lock)"
          checkout "$sandbox/PS5_Vulkan" https://github.com/bizkut/ps5-forever-vulkan.git \
            "$(awk '$1 == "radv-vulkan" { print $3 }' ps5/deps.lock)"
          checkout "$sandbox/PS5_Mesa" https://github.com/bizkut/ps5-forever-mesa.git \
            "$(awk '$1 == "radv-mesa" { print $3 }' ps5/deps.lock)"
          mkdir -p "$sandbox/PS5_Vulkan/.deps/native" .deps/ps5/radv
          ln -sfn "$GITHUB_WORKSPACE/.deps/ps5/ps5-payload-sdk" "$sandbox/PS5_Vulkan/.deps/native/ps5-payload-sdk"
          radv_install="$GITHUB_WORKSPACE/.deps/ps5/radv-source/install-$(sha256sum ps5/tools/meson-radv.sh | cut -c1-16)"
          PS5_RADV_REVISION="$(awk '$1 == "radv-mesa" { print $3 }' ps5/deps.lock)" \
            PS5_RADV_INSTALL="$radv_install" \
            PS5_RADV_SDK_MAP="$sandbox/PS5_Vulkan/.deps/native/ps5-payload-sdk" \
            MESON="$GITHUB_WORKSPACE/ps5/tools/meson-radv.sh" \
            LLVM_CONFIG="$(command -v llvm-config-19)" JOBS=8 \
            python3 "$sandbox/ps5-proton/ps5-wow/ps5/radv/build-radv.py"
          cp "$radv_install/lib/libvulkan_radeon.ps5.a" .deps/ps5/radv/
          cp -a "$radv_install/include" .deps/ps5/radv/
          sha256sum .deps/ps5/radv/libvulkan_radeon.ps5.a
          pin=$(awk '$1 == "radv-archive" { sub(/^sha256:/, "", $3); print $3 }' ps5/deps.lock)
          echo "$pin  .deps/ps5/radv/libvulkan_radeon.ps5.a" | sha256sum --check --strict
          headers_pin=$(awk '$1 == "radv-headers" { sub(/^sha256:/, "", $3); print $3 }' ps5/deps.lock)
          headers_hash=$(find .deps/ps5/radv/include -type f -printf '%P\n' | LC_ALL=C sort |
            (cd .deps/ps5/radv/include && xargs -d '\n' sha256sum) | sha256sum | cut -d' ' -f1)
          [[ "$headers_hash" == "$headers_pin" ]] || { echo 'RADV header cache mismatch' >&2; exit 1; }
      - name: Build or reuse pinned LLVM
        run: |
          set -euo pipefail
          llvm=build/ps5/llvm
          key=$(cat ps5/tools/build-llvm-ps5.sh ps5/patches/llvm-18-ps5-*.patch ps5/deps.lock | sha256sum)
          archive="$llvm/llvm-project-18.1.8.src.tar.xz"
          source_sha=0b58557a6d32ceee97c8d533a59b9212d87e0fc4d2833924eb6c611247db2f2a
          if [[ -f $llvm/.release-key && $(<"$llvm/.release-key") == "$key" && -f $llvm/.release-digests ]] &&
             echo "$source_sha  $archive" | sha256sum --check --strict &&
             sha256sum --check --strict "$llvm/.release-digests" &&
             [[ -x $llvm/host/bin/llvm-config && -f $llvm/target/lib/libclangCodeGen.a ]]; then
            echo 'Reusing digest-verified LLVM build'
          else
            rm -rf -- "$llvm/host" "$llvm/target"
            bash ps5/tools/build-llvm-ps5.sh
            (find "$llvm/host/lib" "$llvm/target/lib" -maxdepth 1 -name '*.a' -type f -print0;
             printf '%s\0' "$llvm/host/bin/llvm-config" "$llvm/host/bin/llvm-tblgen" \
               "$llvm/host/bin/clang-tblgen") | sort -z | xargs -0 sha256sum > "$llvm/.release-digests"
            printf '%s\n' "$key" > "$llvm/.release-key"
          fi
      - name: Prepare host test dependencies
        run: |
          PYTHON=python3 bash ps5/tools/build-capstone-ps5.sh
          rm -rf -- build/ps5/importer/host/source
          make -C ps5/importer package
      - name: Run host tests without game files
        run: |
          mkdir -p build
          make -C ps5/storagebroker host-test
          bash tools/test_gamecode_link.sh
          bash tools/test_gamecode_identity.sh
          bash tools/test_gamecode_receipt.sh
          bash tools/test_gamecode_settings.sh
          cc -std=c11 -O2 tools/test_home_art_gate.c -o build/test_home_art_gate
          build/test_home_art_gate
          cc -std=c11 -O2 tools/test_text_sdf.c -lm -pthread -o build/test_text_sdf
          build/test_text_sdf
          make test-ps5-video-defaults
          cc -std=c11 -O2 tools/test_dynamic_resolution.c runtime/ps5/dynamic_resolution.c -lm \
            -o build/test_dynamic_resolution
          build/test_dynamic_resolution
      - name: Build console title and storage broker
        run: |
          PS5_GAMECODE=console PYTHON=python3 bash ps5/tools/build-game.sh
          make -C ps5/storagebroker
          git status --porcelain --untracked-files=normal
          [[ -z $(git status --porcelain --untracked-files=normal) ]] || {
            echo 'Build modified the checkout' >&2; exit 1;
          }
      - name: Package public release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            bash ps5/tools/package-public-release.sh
            archive="SavageWind-PS5-${REF_NAME}.zip"
          else
            bash ps5/tools/package-public-release.sh --candidate
            archive="SavageWind-PS5-candidate-$(git rev-parse --short=12 HEAD).zip"
          fi
          cd build/ps5/releases
          sha256sum "$archive" > SHA256SUMS
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload candidate
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savagewind-ps5-candidate
          path: |
            build/ps5/releases/${{ env.RELEASE_ARCHIVE }}
            build/ps5/releases/SHA256SUMS
          if-no-files-found: error
      - name: Publish release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          text = Path('docs/RELEASING.md').read_text(encoding='utf-8')
          start = f'<!-- release-notes:{tag}:start -->'
          end = f'<!-- release-notes:{tag}:end -->'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit(f'Missing or duplicate release notes markers for {tag}')
          before, rest = text.split(start)
          body, after = rest.split(end)
          if end in before or start in after or not body.strip():
              raise SystemExit(f'Invalid or empty release notes for {tag}')
          Path(os.environ['RUNNER_TEMP'], 'ps5-release-notes.md').write_text(
              body.strip() + '\n', encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" --verify-tag --title "Breath of the Wild PS5 $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/ps5-release-notes.md" \
            "build/ps5/releases/SavageWind-PS5-${RELEASE_TAG}.zip" build/ps5/releases/SHA256SUMS
